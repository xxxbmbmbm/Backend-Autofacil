spring.application.name=ms-usuarios
server.port=8081

# Base de datos (los valores por defecto sirven para correr en local con docker compose)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/autofacil_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USUARIO:autofacil}
spring.datasource.password=${DB_CLAVE:autofacil}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: el mismo secreto debe estar en todos los microservicios
autofacil.jwt.secreto=${JWT_SECRETO:Q2FtYmlhRXN0ZVNlY3JldG9FblByb2R1Y2Npb25BdXRvRmFjaWwyMDI2IQ==}
autofacil.jwt.emisor=autofacil
autofacil.jwt.minutos-acceso=${JWT_MINUTOS_ACCESO:15}
autofacil.jwt.dias-renovacion=${JWT_DIAS_RENOVACION:7}

# Cuentas iniciales
autofacil.inicial.admin-correo=${ADMIN_CORREO:admin@autofacil.cl}
autofacil.inicial.admin-clave=${ADMIN_CLAVE:Admin@2026}
autofacil.inicial.vendedor-correo=${VENDEDOR_CORREO:vendedor@autofacil.cl}
autofacil.inicial.vendedor-clave=${VENDEDOR_CLAVE:Vendedor@2026}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

management.endpoints.web.exposure.include=health
